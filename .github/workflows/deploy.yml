name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/QLDaKenh
            git pull --ff-only origin main
            npm ci
            npm run check
            command -v ffmpeg
            python3 -m venv .copy-runtime
            .copy-runtime/bin/pip install --disable-pip-version-check -r scripts/social-copy-requirements.txt
            pm2 restart qlda-kenh
