plugins { id 'com.android.application' }
android {
 namespace 'vn.megaphuong.qldakenh'
 compileSdk 36
 defaultConfig { applicationId 'vn.megaphuong.qldakenh'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0.0' }
 def signingFile = rootProject.file('signing.properties')
 if(signingFile.exists()) {
  def keys = new Properties(); signingFile.withInputStream { keys.load(it) }
  signingConfigs { release { storeFile rootProject.file(keys['storeFile']); storePassword keys['storePassword']; keyAlias keys['keyAlias']; keyPassword keys['keyPassword'] } }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }
