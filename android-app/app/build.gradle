plugins { id 'com.android.application' }
android {
 namespace 'vn.megaphuong.qldakenh'
 compileSdk 36
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig { applicationId 'vn.megaphuong.qldakenh'; minSdk 24; targetSdk 36; versionCode 3; versionName '1.0.2' }
 testOptions { unitTests.includeAndroidResources = true }
 def signingFile = rootProject.file('signing.properties')
 if(signingFile.exists()) {
  def keys = new Properties(); signingFile.withInputStream { keys.load(it) }
  signingConfigs { release { storeFile rootProject.file(keys['storeFile']); storePassword keys['storePassword']; keyAlias keys['keyAlias']; keyPassword keys['keyPassword'] } }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 }
}
dependencies {
 implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.16.1'
}
